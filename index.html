<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Город будущего · живой фон</title>
<link rel="icon" href="data:,">
<link rel="preload" as="image" href="assets/background.webp">
<link rel="modulepreload" href="vendor/three/build/three.module.min.js">
<link rel="modulepreload" href="vendor/three/build/three.core.min.js">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{overflow:hidden;background:#cfe0f7}

  /* The stage keeps the picture's own aspect ratio (1446 x 1800) and covers the viewport.
     Background, 3D layer and cut-out layers share its coordinate space exactly.
     scene.js frames it per screen (which part of the picture stays in view);
     the CSS below is only the centred fallback before the script runs. */
  .viewport{position:fixed;inset:0;overflow:hidden}
  .stage{
    position:absolute;
    width:max(100vw, 100dvh * 1446 / 1800);
    aspect-ratio:1446 / 1800;
    left:50%;top:50%;transform:translate(-50%,-50%);
  }
  .stage.framed{transform:none}
  .stage > *{position:absolute;inset:0;width:100%;height:100%}
  .bg{background:url(assets/background.webp) center/100% 100% no-repeat}
  canvas.world{display:block;pointer-events:none}
  .stage > .layer{inset:auto;pointer-events:none;z-index:2}
  .bg{z-index:0} canvas.world{z-index:1}
  .stage > .layer.behind{z-index:0}   /* a layer the robot is currently in front of */
  .occ{background:url(assets/background.webp) center/100% 100% no-repeat;pointer-events:none}
  .debug .occ{outline:2px solid #f0f;background-color:rgba(255,0,255,.15)}
</style>
</head>
<body>
<div class="viewport">
  <div class="stage" id="stage">
    <div class="bg" role="img" aria-label="Город будущего: эстакада, дорога, остановка и тоннель"></div>
    <canvas class="world" id="world"></canvas>
    <!-- Cut-out layers. Positions below are in the ORIGINAL picture's pixels (1446 x 1087),
         which sits in the tall background 368 px from the top; percentages are of 1446 x 1800. -->
    <!-- the arch with its island, trees and lamp: traffic passes behind it. x 969, y 382, 477.3 x 354.2 -->
    <img class="layer" src="assets/arch.webp" alt="" decoding="async"
         style="left:67.012%;top:41.667%;width:33.010%;height:19.680%">
    <!-- the station building: the monorail runs behind it. Cut at y 560 so the bench, bollards
         and stop below stay in the background and buses pass in front. x 0, y 68, 375.3 x 492 -->
    <img class="layer" src="assets/building.webp" alt="" decoding="async"
         style="left:0;top:24.222%;width:25.951%;height:27.333%">
    <!-- right sidewalk: the flower planter and, in front of it, the lamp; the robot passes behind both.
         Flower: x 1369, y 726, 77 x 168. Lamp: x 1332, y 737, 45.1 x 185.3 -->
    <img class="layer" id="flowerLayer" src="assets/flower.webp" alt="" decoding="async"
         style="left:94.675%;top:60.778%;width:5.325%;height:9.333%">
    <img class="layer" src="assets/lamp.webp" alt="" decoding="async"
         style="left:92.116%;top:61.389%;width:3.118%;height:10.295%">

    <!-- occluders are injected here: copies of the picture clipped to things that stand in front of traffic -->
  </div>
</div>

<script type="importmap">
{"imports":{
  "three":"./vendor/three/build/three.module.min.js",
  "three/addons/":"./vendor/three/examples/jsm/"
}}
</script>
<script type="module" src="scene.js"></script>
</body>
</html>
