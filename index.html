<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Город будущего · живой фон</title>
<link rel="icon" href="data:,">
<link rel="preload" as="image" href="assets/background.webp">
<link rel="modulepreload" href="vendor/three/build/three.module.min.js">
<link rel="modulepreload" href="vendor/three/build/three.core.min.js">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{overflow:hidden;background:#cfe0f7}

  /* The stage keeps the picture's own aspect ratio and covers the viewport.
     Background, 3D layer and occluders share its coordinate space exactly. */
  .viewport{position:fixed;inset:0;overflow:hidden}
  .stage{
    --iw:1446; --ih:1087;
    --fx:.42;                       /* horizontal focus on narrow screens */
    position:absolute;top:50%;
    width:max(100vw, 100dvh * 1446 / 1087);
    aspect-ratio:1446 / 1087;
    left:calc((100vw - max(100vw, 100dvh * 1446 / 1087)) * var(--fx));
    transform:translateY(-50%);
  }
  .stage > *{position:absolute;inset:0;width:100%;height:100%}
  .bg{background:url(assets/background.webp) center/100% 100% no-repeat}
  canvas.world{display:block;pointer-events:none}
  .stage > .layer{inset:auto;pointer-events:none;z-index:2}
  .bg{z-index:0} canvas.world{z-index:1}
  .stage > .layer.behind{z-index:0}   /* a layer the robot is currently in front of */
  .occ{background:url(assets/background.webp) center/100% 100% no-repeat;pointer-events:none}
  .debug .occ{outline:2px solid #f0f;background-color:rgba(255,0,255,.15)}
</style>
</head>
<body>
<div class="viewport">
  <div class="stage" id="stage">
    <div class="bg" role="img" aria-label="Город будущего: эстакада, дорога, остановка и тоннель"></div>
    <canvas class="world" id="world"></canvas>
    <!-- the arch with its island, trees and lamp, cut out by hand: traffic passes behind it.
         Placed in picture pixels: x 969, y 382, size 477.3 x 354.2 (of 1446 x 1087). -->
    <img class="layer" src="assets/arch.webp" alt="" decoding="async"
         style="left:67.012%;top:35.143%;width:33.010%;height:32.589%">
    <!-- the station building: the monorail runs behind it. Cut at picture y 560,
         so the bench, bollards and stop below stay in the background and buses pass in front.
         Placed in picture pixels: x 0, y 68, size 375.3 x 492. -->
    <img class="layer" src="assets/building.webp" alt="" decoding="async"
         style="left:0;top:6.256%;width:25.951%;height:45.262%">
    <!-- right sidewalk: the flower planter and, in front of it, the lamp; the robot passes behind both.
         Flower: x 1369, y 726, 77 x 168. Lamp: x 1332, y 737, 45.1 x 185.3 (picture pixels). -->
    <img class="layer" id="flowerLayer" src="assets/flower.webp" alt="" decoding="async"
         style="left:94.675%;top:66.789%;width:5.325%;height:15.455%">
    <img class="layer" src="assets/lamp.webp" alt="" decoding="async"
         style="left:92.116%;top:67.801%;width:3.118%;height:17.048%">

    <!-- occluders are injected here: copies of the picture clipped to things that stand in front of traffic -->
  </div>
</div>

<script type="importmap">
{"imports":{
  "three":"./vendor/three/build/three.module.min.js",
  "three/addons/":"./vendor/three/examples/jsm/"
}}
</script>
<script type="module" src="scene.js"></script>
</body>
</html>
